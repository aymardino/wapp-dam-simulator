# Server deployment: API + front end in one image, Caddy for automatic HTTPS.
# Set DOMAIN in .env (see .env.example), then: docker compose up -d
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: unless-stopped
    env_file: .env
    volumes:
      - wapp-data:/app/data
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-wapp-dam-simulator.mastereose.fr}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
volumes:
  wapp-data:
  caddy-data:
  caddy-config:
