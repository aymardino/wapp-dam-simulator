# Déploiement sur Render en un clic (Blueprint) : Dashboard → New → Blueprint → ce dépôt.
# Service web Docker (API + site compilé), disque persistant pour les salles (data/rooms.db), contrôle de santé.
# Coût indicatif : plan Starter (7 $/mois) + disque 1 Go (0,25 $/mois). Le plan Free n'a pas de disque :
# les salles seraient perdues à chaque redémarrage et le service s'endort après 15 min d'inactivité.
services:
  - type: web
    name: wapp-dam-simulator
    runtime: docker
    dockerfilePath: ./Dockerfile.app
    dockerContext: .
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /api/v1/health
    disk:
      name: wapp-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: WAPP_CORS_ORIGINS
        value: https://wapp-dam-simulator.org,https://wapp-dam-simulator.onrender.com
      - key: WAPP_ROOM_TTL_DAYS
        value: "30"
      - key: WAPP_MAX_ROOMS_PER_IP_PER_DAY
        value: "20"
