# One-click deployment on Render (Blueprint): Dashboard → New → Blueprint → this repository.
# Docker web service (API + compiled website), persistent disk for the rooms (data/rooms.db), health check.
# Indicative cost: Starter plan ($7/month) + 1 GB disk ($0.25/month). The Free plan has no disk:
# rooms would be lost at every restart and the service sleeps after 15 min of inactivity.
services:
  - type: web
    name: wapp-dam-simulator
    runtime: docker
    dockerfilePath: ./Dockerfile.app
    dockerContext: .
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /api/v1/health
    disk:
      name: wapp-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: WAPP_CORS_ORIGINS
        value: https://wapp-dam-simulator.mastereose.fr,https://wapp-dam-simulator.onrender.com
      - key: WAPP_ROOM_TTL_DAYS
        value: "30"
      - key: WAPP_MAX_ROOMS_PER_IP_PER_DAY
        value: "20"
