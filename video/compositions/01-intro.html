              <g id="s01-dashg"><path id="s01-dash" d="M12 31 H52" stroke="#8FD3B5" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round" /></g>

  <script>
    (function () {
      const $ = id => document.getElementById(id)
      $('s01-kicker').textContent = WAPP.t('s01.kicker')
      $('s01-wordmark').textContent = WAPP.t('s01.wordmark')
      $('s01-tagline').textContent = WAPP.t('s01.tagline')

      const tl = gsap.timeline({ paused: true })
      // the ground settles slowly; the whole content drifts a little closer
      tl.fromTo('#s01-ground', { scale: 1.06 }, { scale: 1, duration: 6, ease: 'sine.out' }, 0)
      tl.fromTo('#s01-cam', { scale: 1 }, { scale: 1.025, duration: 6, ease: 'sine.inOut' }, 0)

      // 1. the mark, large and centred (tile centre 960,300 moved to the screen centre 960,540, ×3.4), without its tile
      tl.fromTo('#s01-tile', { y: 240, scale: 3.4 }, { y: 240, scale: 3.4, duration: 0.01 }, 0)
      tl.fromTo('#s01-tilebg', { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0)
      WAPP.draw(tl, '#s01-stair', 0.2, { duration: 1.4, ease: 'power2.inOut' })
      tl.fromTo('#s01-dashg', { scaleX: 0, transformOrigin: '0% 50%' }, { scaleX: 1, duration: 0.7, ease: 'power2.out' }, 1.2)
      tl.fromTo('#s01-dot', { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.5, ease: 'back.out(1.6)' }, 1.7)
      tl.fromTo('#s01-ring', { opacity: 0 }, { opacity: 0.9, duration: 0.12, ease: 'none' }, 1.85)
      tl.fromTo('#s01-ring', { scale: 1, transformOrigin: '50% 50%' }, { scale: 3.2, duration: 0.9, ease: 'power2.out' }, 1.85)
      tl.to('#s01-ring', { opacity: 0, duration: 0.75, ease: 'power1.out' }, 1.97)

      // 2. it settles into its tile, above the wordmark, and takes the logo's colours
      tl.to('#s01-tile', { y: 0, scale: 1, duration: 0.9, ease: 'power3.inOut' }, 2.4)
      tl.to('#s01-tilebg', { opacity: 1, duration: 0.45, ease: 'power1.out' }, 2.85)
      tl.to('#s01-stair', { attr: { stroke: '#0B3D30' }, duration: 0.45, ease: 'none' }, 2.85)
      tl.to('#s01-dash', { attr: { stroke: '#0F6E56' }, duration: 0.45, ease: 'none' }, 2.85)
      tl.to('#s01-dot', { attr: { stroke: '#0B3D30' }, duration: 0.45, ease: 'none' }, 2.85)

      // 3. kicker, wordmark letter by letter, tagline, rule
      WAPP.rise(tl, '#s01-kicker', 2.95, { y: 24 })
      const split = new SplitText('#s01-wordmark', { type: 'chars' })
      tl.fromTo(split.chars, { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out', stagger: 0.028 }, 3.1)
      WAPP.rise(tl, '#s01-tagline', 3.75, { y: 28 })
      WAPP.rule(tl, '#s01-rule', 4.05)

      window.__timelines['01-intro'] = tl
    })()
