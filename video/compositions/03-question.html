<template>
  <!-- 03 · question (7.0 s): the day-ahead market in one sentence, over a strip of the 24 hours of tomorrow (bar
       height: the day's mean price of each hour), then its three questions. -->
  <style>
    #root { position: absolute; inset: 0; }
    #s03-cam { position: absolute; inset: 0; }
    .s03-line { position: absolute; left: 128px; color: var(--brand-ink); white-space: nowrap; }
    #s03-l1 { top: 170px; }
    #s03-l2 { top: 246px; }
    #s03-strip { position: absolute; left: 128px; top: 352px; width: 1176px; height: 72px; display: flex; align-items: flex-end; gap: 10px; }
    .s03-bar { display: block; width: 39px; border-radius: 4px; background: var(--mint); opacity: 0.5; transform-origin: 50% 100%; }
    .s03-q { position: absolute; left: 128px; color: #FFFFFF; white-space: nowrap; }
    #s03-q1 { top: 492px; }
    #s03-q2 { top: 622px; }
    #s03-q3 { top: 752px; color: var(--amber); }
    #s03-rule { position: absolute; left: 132px; top: 890px; margin-top: 0; }
  </style>
  <div id="root" data-composition-id="03-question" data-width="1920" data-height="1080" data-duration="7">
    <div id="s03-stage" class="clip wapp-stage" data-start="0" data-duration="7" data-track-index="0">
      <div id="s03-frame" class="wapp-frame wapp-bg-brand">
        <div id="s03-cam">
          <span id="s03-l1" class="s03-line wapp-h2"></span>
          <span id="s03-l2" class="s03-line wapp-h2"></span>
          <div id="s03-strip"></div>
          <span id="s03-q1" class="s03-q wapp-display"></span>
          <span id="s03-q2" class="s03-q wapp-display"></span>
          <span id="s03-q3" class="s03-q wapp-display"></span>
          <span id="s03-rule" class="wapp-rule"></span>
        </div>
      </div>
      <div id="s03-sweep" class="wapp-sweep"></div>
    </div>
  </div>
  <script>
    (function () {
      const $ = id => document.getElementById(id)
      for (const k of ['l1', 'l2']) $('s03-' + k).textContent = WAPP.t('s03.line' + k.slice(1))
      for (const k of ['q1', 'q2', 'q3']) $('s03-' + k).textContent = WAPP.t('s03.' + k)
      // 24 bars: the mean price of each hour over the 14 countries, as the website's hour strip
      const d = WAPP.data, zones = Object.keys(d.prices)
      const means = d.hours.map(h => zones.reduce((a, z) => a + d.prices[z][String(h)], 0) / zones.length)
      const max = Math.max(...means)
      const bars = means.map(m => { const b = document.createElement('span'); b.className = 's03-bar'; b.style.height = `${Math.max(14, (m / max) * 72)}px`; $('s03-strip').appendChild(b); return b })

      const tl = gsap.timeline({ paused: true })
      WAPP.wipeIn(tl, '#s03-frame', '#s03-sweep', 0)
      tl.fromTo('#s03-cam', { scale: 1 }, { scale: 1.03, transformOrigin: '20% 50%', duration: 7, ease: 'sine.inOut' }, 0)
      WAPP.rise(tl, '#s03-l1', 0.4)
      WAPP.rise(tl, '#s03-l2', 1.0)
      tl.fromTo(bars, { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: 'power2.out', stagger: 0.03 }, 1.3)
      // the three questions, word by word
      ;[['#s03-q1', 2.3], ['#s03-q2', 3.2], ['#s03-q3', 4.1]].forEach(([sel, at]) => {
        const words = new SplitText(sel, { type: 'words' }).words
        tl.fromTo(words, { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out', stagger: 0.09 }, at)
      })
      WAPP.rule(tl, '#s03-rule', 4.6)
      // the hours of tomorrow: an amber highlight travels along the strip
      const o = { i: -1 }
      const paint = () => bars.forEach((b, i) => { const on = i === Math.floor(o.i); b.style.background = on ? '#F2B134' : '#8FD3B5'; b.style.opacity = on ? '1' : '0.5' })
      paint()
      tl.fromTo(o, { i: -1 }, { i: 23.99, duration: 2.4, ease: 'none', onUpdate: paint }, 4.4)
      window.__timelines['03-question'] = tl
    })()
  </script>
</template>
