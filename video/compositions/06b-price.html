<template>
  <!-- 06b · price (11 s): question 3 in detail, on the one real case of the day (WAPP.data.midpoint): Niger at 16 h,
       behind a full line, no order is partly served; any price between the best bid not served and the cheapest
       offer not called respects the trades, and the engine publishes the middle. -->
  <style>
    #root { position: absolute; inset: 0; }
    #s6b-col { position: absolute; left: 128px; top: 150px; width: 640px; display: flex; flex-direction: column; gap: 28px; }
    #s6b-title { margin-top: -8px; }
    #s6b-case { display: block; font-size: 36px; line-height: 1.3; font-weight: 500; color: var(--brand-ink); }
    #s6b-rulebox { margin-top: 30px; }
    .s6b-sw { display: block; width: 56px; height: 8px; border-radius: 4px; margin-bottom: 14px; background: var(--amber); }
    #s6b-ruletxt { display: block; font-size: 40px; line-height: 1.25; font-weight: 700; color: #FFFFFF; }
    #s6b-card { position: absolute; left: 880px; top: 120px; width: 912px; height: 840px; }
    #s6b-svg { position: absolute; left: 0; top: 0; width: 912px; height: 840px; overflow: visible; }
    #s6b-badge { position: absolute; right: 128px; top: 64px; }
  </style>
  <div id="root" data-composition-id="06b-price" data-width="1920" data-height="1080" data-duration="11">
    <div id="s6b-stage" class="clip wapp-stage" data-start="0" data-duration="11" data-track-index="0">
      <div id="s6b-frame" class="wapp-frame wapp-bg-deep">
        <div id="s6b-col">
          <span id="s6b-kicker" class="wapp-kicker"></span>
          <span id="s6b-title" class="wapp-h2"></span>
          <span id="s6b-case"></span>
          <div id="s6b-rulebox"><span class="s6b-sw"></span><span id="s6b-ruletxt"></span></div>
        </div>
        <span id="s6b-badge" class="wapp-badge"></span>
        <div id="s6b-card" class="wapp-card"><svg id="s6b-svg" viewBox="0 0 912 840" aria-hidden="true"></svg></div>
      </div>
      <div id="s6b-sweep" class="wapp-sweep"></div>
    </div>
  </div>
  <script>
    (function () {
      const $ = id => document.getElementById(id)
      const m = WAPP.data.midpoint
      $('s6b-kicker').textContent = WAPP.t('s6b.kicker')
      $('s6b-title').textContent = WAPP.t('s6b.title')
      $('s6b-case').textContent = WAPP.t('s6b.case', { zone: WAPP.zoneName(m.zone), hour: WAPP.hour(m.hour) })
      $('s6b-ruletxt').textContent = WAPP.t('s6b.rule')
      $('s6b-badge').textContent = WAPP.t('badge')

      // a vertical price scale, 16 px per $/MWh, from lo − 15 to hi + 15
      const P0 = m.lo - 15, P1 = m.hi + 15, TOP = 110, K = 16
      const Y = p => TOP + (P1 - p) * K
      const XA = 150, XB = 860   // plot, card coordinates
      const NS = 'http://www.w3.org/2000/svg', svg = $('s6b-svg')
      const add = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e }
      const txt = (attrs, s, parent) => { const e = add('text', { 'font-family': 'Roboto, sans-serif', ...attrs }, parent); e.textContent = s; return e }
      const scale = add('g', {})
      add('line', { x1: XA - 30, x2: XA - 30, y1: Y(P1), y2: Y(P0), stroke: 'rgba(215,232,225,0.45)', 'stroke-width': 2 }, scale)
      for (let p = P0; p <= P1; p += 5) {
        add('line', { x1: XA - 40, x2: XA - 30, y1: Y(p), y2: Y(p), stroke: 'rgba(215,232,225,0.45)', 'stroke-width': 2 }, scale)
        txt({ x: XA - 52, y: Y(p) + 9, 'text-anchor': 'end', 'font-size': 26, fill: '#8FA89F', 'font-family': 'JetBrains Mono, monospace' }, String(p), scale)
      }
      txt({ x: XA - 52, y: Y(P1) - 34, 'text-anchor': 'end', 'font-size': 26, fill: '#8FA89F' }, '$/MWh', scale)
      // the band of prices that fit
      const band = add('rect', { x: XA, y: Y(m.hi), width: XB - XA, height: (m.hi - m.lo) * K, fill: '#F2B134', 'fill-opacity': 0.16 })
      const bandLab = txt({ x: XB - 16, y: Y(m.hi) + 40, 'text-anchor': 'end', 'font-size': 26, fill: '#F2B134' }, WAPP.t('s6b.band'))
      // upper bound: the cheapest offer not called
      const hi = add('g', {})
      const hiLine = add('line', { x1: XA, x2: XB, y1: Y(m.hi), y2: Y(m.hi), stroke: '#8FD3B5', 'stroke-width': 5, 'stroke-linecap': 'round' }, hi)
      const hiTxt = add('g', {}, hi)
      txt({ x: XA, y: Y(m.hi) - 52, 'font-size': 30, 'font-weight': 700, fill: '#FFFFFF' }, WAPP.t('s6b.hiLab', { p: m.hi }), hiTxt)
      txt({ x: XA, y: Y(m.hi) - 16, 'font-size': 26, fill: '#D7E8E1' }, WAPP.t('s6b.hiWhy'), hiTxt)
      // lower bound: the best bid not served
      const lo = add('g', {})
      const loLine = add('line', { x1: XA, x2: XB, y1: Y(m.lo), y2: Y(m.lo), stroke: '#FF6B4A', 'stroke-width': 5, 'stroke-linecap': 'round' }, lo)
      const loTxt = add('g', {}, lo)
      txt({ x: XA, y: Y(m.lo) + 44, 'font-size': 30, 'font-weight': 700, fill: '#FFFFFF' }, WAPP.t('s6b.loLab', { p: m.lo }), loTxt)
      txt({ x: XA, y: Y(m.lo) + 80, 'font-size': 26, fill: '#D7E8E1' }, WAPP.t('s6b.loWhy'), loTxt)
      // the middle
      const mid = (m.lo + m.hi) / 2
      const dot = add('circle', { cx: XA + 70, cy: Y(mid), r: 16, fill: '#F2B134', stroke: '#07241C', 'stroke-width': 3 })
      const pick = txt({ x: XA + 104, y: Y(mid) + 12, 'font-size': 34, 'font-weight': 700, fill: '#F2B134', 'font-family': 'JetBrains Mono, monospace' }, WAPP.t('s6b.pick', { p: WAPP.num(m.price) }))

      const tl = gsap.timeline({ paused: true })
      WAPP.wipeIn(tl, '#s6b-frame', '#s6b-sweep', 0)
      WAPP.rise(tl, ['#s6b-kicker', '#s6b-title'], 0.35, { stagger: 0.12 })
      WAPP.rise(tl, '#s6b-case', 1.0)
      tl.fromTo('#s6b-badge', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'none' }, 1.0)
      WAPP.rise(tl, '#s6b-card', 1.3, { y: 40, duration: 0.9 })
      tl.fromTo(scale, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'none' }, 1.6)
      // the two bounds
      WAPP.draw(tl, hiLine, 2.4, { duration: 0.7 })
      WAPP.rise(tl, hiTxt, 2.6, { y: 16 })
      WAPP.draw(tl, loLine, 3.8, { duration: 0.7 })
      WAPP.rise(tl, loTxt, 4.0, { y: -16 })
      // every price in between fits
      tl.fromTo(band, { scaleY: 0, transformOrigin: '50% 50%' }, { scaleY: 1, duration: 0.8, ease: 'power2.out' }, 5.2)
      tl.fromTo(bandLab, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'none' }, 5.6)
      // the engine takes the middle
      tl.fromTo(dot, { y: (mid - m.lo) * K, scale: 0, transformOrigin: '50% 50%' }, { y: (mid - m.lo) * K, scale: 1, duration: 0.4, ease: 'back.out(1.6)' }, 6.5)
      tl.to(dot, { y: 0, duration: 1.0, ease: 'power2.inOut' }, 6.9)
      WAPP.rise(tl, pick, 7.8, { y: 12 })
      WAPP.rise(tl, '#s6b-rulebox', 8.3)
      window.__timelines['06b-price'] = tl
    })()
  </script>
</template>
